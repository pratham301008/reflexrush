<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#111622" />
      <stop offset="100%" stop-color="#070a0e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="50%" stop-color="#00d9f5" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <circle cx="600" cy="200" r="450" fill="url(#halo)" />

  <!-- Grid decoration lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Central Badge -->
  <rect x="520" y="80" width="160" height="42" rx="21" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
  <text x="600" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#00f5a0" text-anchor="middle" letter-spacing="2">VIRAL REACTION CHALLENGE</text>

  <!-- Main Headline -->
  <text x="600" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">THINK YOU CAN BEAT</text>
  <text x="600" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="-2">YOUR FRIENDS?</text>

  <!-- Tagline -->
  <text x="600" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="500" fill="#9ca3af" text-anchor="middle">Test your raw human reflex speed in milliseconds. Share your score. Dare your crew.</text>

  <!-- Score pill mockup -->
  <rect x="420" y="440" width="360" height="88" rx="20" fill="#161b26" stroke="#22c55e" stroke-width="2" />
  <text x="600" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#22c55e" text-anchor="middle" letter-spacing="1.5">⚡ LIGHTNING FAST</text>
  <text x="600" y="514" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">198 ms AVG</text>

  <!-- Footer link -->
  <text x="600" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#6b7280" text-anchor="middle">Play free in your mobile or desktop browser</text>
</svg>
